name: Publish verified APK
on:
  push:
    branches: [main]
    paths: ['downloads/release.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: betterlyrics-release
  cancel-in-progress: false
jobs:
  widget:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Android 16 widget and fonts
        run: bash tools/emulator-widget-ci.sh widget
      - name: Save widget evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-validation-widget
          path: |
            ${{ runner.temp }}/WIDGET_VALIDATION.json
            ${{ runner.temp }}/WIDGET_LOGCAT.txt
          if-no-files-found: error
          overwrite: true
  playlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Android 16 playlist and playback
        run: bash tools/emulator-widget-ci.sh playlist
      - name: Save playlist evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-validation-playlist
          path: |
            ${{ runner.temp }}/PLAYLIST_VALIDATION.json
            ${{ runner.temp }}/PLAYLIST_LOGCAT.txt
          if-no-files-found: error
          overwrite: true
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify signed APK installation and previous-version updates
        run: bash tools/emulator-widget-ci.sh install
      - name: Save installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-validation-install
          path: ${{ runner.temp }}/INSTALL_VALIDATION.json
          if-no-files-found: error
          overwrite: true
  release:
    needs: [widget, playlist, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source regressions and public package
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          python3 tools/release-preflight.py --sdk "$ANDROID_HOME" --report "$RUNNER_TEMP/RELEASE_VALIDATION.json"
          python3 - <<'PY_ENV'
          import json, os
          from pathlib import Path
          meta=json.loads(Path('downloads/release.json').read_text())
          notes=Path('changelog')/(meta['version']+'.md')
          if not notes.is_file() or not notes.read_text(encoding='utf-8').strip():
              raise SystemExit('Missing release notes: '+str(notes))
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('RELEASE_VERSION='+meta['version']+'\nRELEASE_APK='+meta['apk']+'\n')
          PY_ENV
      - name: Browser playback and appearance regressions
        run: |
          npm install --prefix "$RUNNER_TEMP/betterlyrics-browser" --no-save --package-lock=false playwright@1.62.1
          export NODE_PATH="$RUNNER_TEMP/betterlyrics-browser/node_modules"
          node "$NODE_PATH/playwright/cli.js" install --with-deps chromium
          export BETTERLYRICS_PREVIEW_URL=http://127.0.0.1:4173/
          node tools/preview.cjs --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          node - <<'JS'
          const assert=require('node:assert/strict'),fs=require('node:fs');
          (async()=>{
            for(let attempt=0;attempt<30;attempt++){
              try{
                const response=await fetch(process.env.BETTERLYRICS_PREVIEW_URL);
                assert.equal(response.status,200);
                assert.equal(await response.text(),fs.readFileSync('app/src/main/assets/web/index.html','utf8'));
                return;
              }catch(error){if(attempt===29)throw error;await new Promise(resolve=>setTimeout(resolve,500));}
            }
          })().catch(error=>{console.error(error);process.exit(1);});
          JS
          for suite in ui flow player appearance review customization playlist controls; do node "tools/$suite-smoke.cjs"; done
          python3 - <<'PY_UI'
          import json, os
          from pathlib import Path
          suites = {
              name: json.loads(Path(file).read_text()) for name, file in {
                  'ui': 'build/ui-qa/results.json',
                  'flow': 'build/ui-qa/flow-results.json',
                  'player': 'build/ui-qa/player-results.json',
                  'appearance': 'build/ui-qa/appearance-results.json',
                  'review': 'build/review-qa/results.json',
                  'customization': 'build/customization-qa/results.json',
                  'playlist': 'build/playlist-qa/results.json',
                  'controls': 'build/ui-qa/controls-results.json',
              }.items()
          }
          assert all(result['passed'] and not result['errors'] for result in suites.values())
          report = {'passed': True, 'sourceCommit': os.environ['GITHUB_SHA'],
                    'checkGroups': sum(len(result['checks']) for result in suites.values()),
                    'scope': 'Chromium with a synthetic Android bridge; not a physical device', 'suites': suites}
          (Path(os.environ['RUNNER_TEMP']) / 'UI_VALIDATION.json').write_text(json.dumps(report, indent=2) + '\n')
          PY_UI
      - name: Collect Android verification reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: android-validation-*
          path: ${{ runner.temp }}/android-validation
          merge-multiple: true
      - name: Confirm Android reports belong to this APK
        run: |
          python3 - <<'PY_ANDROID'
          import json, os
          from pathlib import Path
          reports=Path(os.environ['RUNNER_TEMP'])/'android-validation'
          meta=json.loads(Path('downloads/release.json').read_text())
          for name in ('WIDGET_VALIDATION.json', 'PLAYLIST_VALIDATION.json', 'INSTALL_VALIDATION.json'):
              report=json.loads((reports/name).read_text())
              assert report['passed'], name+' did not pass'
              if name=='INSTALL_VALIDATION.json':
                  assert report['version']==meta['version'] and report['sha256']==meta['sha256']
          PY_ANDROID
      - name: Create release with APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published assets."
            exit 1
          fi
          gh release create "$tag" "downloads/$RELEASE_APK" downloads/SHA256SUMS "$RUNNER_TEMP/RELEASE_VALIDATION.json" "$RUNNER_TEMP/android-validation/INSTALL_VALIDATION.json" "$RUNNER_TEMP/UI_VALIDATION.json" "$RUNNER_TEMP/android-validation/WIDGET_VALIDATION.json" "$RUNNER_TEMP/android-validation/PLAYLIST_VALIDATION.json" --target "$GITHUB_SHA" --title "BetterLyrics Mobile $RELEASE_VERSION" --notes-file "changelog/$RELEASE_VERSION.md" --draft
          gh release edit "$tag" --draft=false --latest
          curl --fail --location --retry 3 --retry-delay 2 --output "$RUNNER_TEMP/published.apk" "https://github.com/${GH_REPO}/releases/download/${tag}/${RELEASE_APK}"
          python3 - "$RUNNER_TEMP/published.apk" <<'PY_HASH'
          import hashlib, json, sys
          from pathlib import Path
          expected=json.loads(Path('downloads/release.json').read_text())['sha256']
          actual=hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest()
          assert actual == expected, 'Public APK download checksum mismatch'
          print('Public release APK downloaded successfully; SHA-256 verified:', actual)
          PY_HASH
