name: Publish verified APK
on:
  push:
    branches: [main]
    paths: ['downloads/release.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: betterlyrics-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source regressions and public package
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          python3 tools/release-preflight.py --sdk "$ANDROID_HOME" --report "$RUNNER_TEMP/RELEASE_VALIDATION.json"
          python3 - <<'PY_ENV'
          import json, os
          from pathlib import Path
          meta=json.loads(Path('downloads/release.json').read_text())
          notes=Path('changelog')/(meta['version']+'.md')
          if not notes.is_file() or not notes.read_text(encoding='utf-8').strip():
              raise SystemExit('Missing release notes: '+str(notes))
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('RELEASE_VERSION='+meta['version']+'\nRELEASE_APK='+meta['apk']+'\n')
          PY_ENV
      - name: Android 16 installation and update regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0 libasound2t64 libnss3 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 libgbm1 libglu1-mesa libvulkan1
          if [ ! -x "$ANDROID_HOME/emulator/emulator" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator"
          fi
          "$ANDROID_HOME/emulator/emulator" -version
          test -c /dev/kvm
          sudo chown "$(id -u)" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          image_ready=false
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "system-images;android-36;google_apis;x86_64"; then image_ready=true; break; fi
            sleep 3
          done
          test "$image_ready" = true
          export ANDROID_AVD_HOME="$RUNNER_TEMP/betterlyrics-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n betterlyrics_install -k "system-images;android-36;google_apis;x86_64" --device pixel_6 --path "$ANDROID_AVD_HOME/betterlyrics_install.avd" --force
          test -f "$ANDROID_AVD_HOME/betterlyrics_install.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx betterlyrics_install
          trap 'result=$?; if [ "$result" -ne 0 ] && [ -f "$RUNNER_TEMP/emulator.log" ]; then tail -100 "$RUNNER_TEMP/emulator.log"; fi' EXIT
          "$ANDROID_HOME/emulator/emulator" -avd betterlyrics_install -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -memory 2048 -cores 2 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          connection_deadline=$((SECONDS + 180))
          until [ "$(adb -s emulator-5554 get-state 2>/dev/null)" = device ]; do
            kill -0 "$emulator_pid"
            if [ "$SECONDS" -ge "$connection_deadline" ]; then exit 1; fi
            sleep 2
          done
          boot_deadline=$((SECONDS + 420))
          until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; do
            if [ "$SECONDS" -ge "$boot_deadline" ]; then tail -80 "$RUNNER_TEMP/emulator.log"; exit 1; fi
            sleep 2
          done
          python3 tools/install-smoke.py --serial emulator-5554 --report "$RUNNER_TEMP/INSTALL_VALIDATION.json"
          adb -s emulator-5554 emu kill
      - name: Create release with APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published assets."
            exit 1
          fi
          gh release create "$tag" "downloads/$RELEASE_APK" downloads/SHA256SUMS "$RUNNER_TEMP/RELEASE_VALIDATION.json" "$RUNNER_TEMP/INSTALL_VALIDATION.json" docs/performance/fft-2026-10-24.json --target "$GITHUB_SHA" --title "BetterLyrics Mobile $RELEASE_VERSION" --notes-file "changelog/$RELEASE_VERSION.md" --draft
          gh release edit "$tag" --draft=false --latest
          curl --fail --location --retry 3 --retry-delay 2 --output "$RUNNER_TEMP/published.apk" "https://github.com/${GH_REPO}/releases/download/${tag}/${RELEASE_APK}"
          python3 - "$RUNNER_TEMP/published.apk" <<'PY_HASH'
          import hashlib, json, sys
          from pathlib import Path
          expected=json.loads(Path('downloads/release.json').read_text())['sha256']
          actual=hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest()
          assert actual == expected, 'Public APK download checksum mismatch'
          print('Public release APK downloaded successfully; SHA-256 verified:', actual)
          PY_HASH
