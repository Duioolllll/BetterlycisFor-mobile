plugins { id 'com.android.application' }
android {
    namespace 'io.betterlyrics.mobile'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'io.betterlyrics.mobile'
        minSdk 26
        targetSdk 36
        versionCode 19
        versionName '0.9.1'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    if (System.getenv('BL_KEYSTORE')) {
        signingConfigs {
            release {
                storeFile file(System.getenv('BL_KEYSTORE'))
                storePassword System.getenv('BL_STORE_PASSWORD')
                keyAlias System.getenv('BL_KEY_ALIAS') ?: 'mobile'
                keyPassword System.getenv('BL_KEY_PASSWORD') ?: System.getenv('BL_STORE_PASSWORD')
            }
        }
        buildTypes { release { signingConfig signingConfigs.release } }
    }
}
